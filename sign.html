<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackly - Sign Up</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #6c5ce7;
    --primary-dark: #5849d6;
    --primary-light: #a29bfe;
    --accent: #00cec9;
    --bg-dark: #0f0f1a;
    --bg-card: rgba(255, 255, 255, 0.97);
    --text-dark: #1e2235;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.45);
    --shadow-md: 0 12px 40px rgba(108, 92, 231, 0.18);
    --radius: 20px;
    --transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-dark);
    position: relative;
    overflow-x: hidden;
    padding: 20px;
}

/* ---- Animated ambient background ---- */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108, 92, 231, 0.35), transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 75%, rgba(0, 206, 201, 0.22), transparent 60%),
        radial-gradient(ellipse 40% 40% at 60% 15%, rgba(162, 155, 254, 0.25), transparent 65%),
        linear-gradient(160deg, #0f0f1a 0%, #141428 55%, #101830 100%);
    z-index: -2;
}

/* Floating orbs */
.orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    z-index: -1;
    pointer-events: none;
}

.orb-1 {
    width: 420px; height: 420px;
    background: rgba(108, 92, 231, 0.45);
    top: -120px; left: -120px;
    animation: drift 14s ease-in-out infinite alternate;
}

.orb-2 {
    width: 360px; height: 360px;
    background: rgba(0, 206, 201, 0.35);
    bottom: -140px; right: -100px;
    animation: drift 18s ease-in-out infinite alternate-reverse;
}

@keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(50px, 40px) scale(1.12); }
}

/* ---- Card ---- */
.signup-wrapper {
    width: 100%;
    max-width: 430px;
    background: var(--bg-card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    transition: var(--transition);
    position: relative;
}

.signup-wrapper:hover {
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.12);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(50px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---- Header ---- */
.signup-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 55%, #4834b8 100%);
    padding: 34px 28px;
    text-align: center;
    color: #fff;
    position: relative;
    overflow: hidden;
}

.signup-header::after {
    content: '';
    position: absolute;
    top: -60%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.18), transparent 50%);
    pointer-events: none;
}

.signup-header .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
}

.signup-header .logo-area img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.35);
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
}

.signup-header .logo-area h2 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #fff 0%, #dfe3ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.signup-header p {
    font-size: 14px;
    opacity: 0.88;
    font-weight: 500;
    letter-spacing: 0.2px;
    position: relative;
    z-index: 1;
}

/* ---- Form Body ---- */
.form-body {
    padding: 32px 28px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #4b5166;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

/* Wrapper anchors icons to the INPUT, not the group */
.input-wrap {
    position: relative;
}

.form-group input {
    width: 100%;
    padding: 14px 46px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dark);
    background: #fafbfd;
    transition: var(--transition);
    outline: none;
}

.form-group input::placeholder {
    color: #a7adbd;
    font-weight: 400;
}

.form-group input:hover {
    border-color: #cfd4e4;
    background: #fff;
}

.form-group input:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.12);
}

.form-group .input-icon {
    position: absolute;
    left: 17px;
    top: 50%;
    transform: translateY(-50%);
    color: #a7adbd;
    font-size: 15px;
    transition: var(--transition);
    pointer-events: none;
}

.form-group input:focus + .input-icon,
.form-group input:not(:placeholder-shown) + .input-icon {
    color: var(--primary);
}

/* ---- Toggle Password ---- */
.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #a7adbd;
    cursor: pointer;
    font-size: 15px;
    padding: 5px;
    border-radius: 6px;
    transition: var(--transition);
}

.toggle-password:hover {
    color: var(--primary);
    background: rgba(108, 92, 231, 0.08);
}

/* ---- Password Strength Hint ---- */
.hint-text {
    font-size: 12px;
    color: #a0a6b8;
    margin-top: 7px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 6px;
}

.hint-text i {
    font-size: 11px;
    margin-top: 2px;
    color: var(--primary-light);
}

/* ---- Sign Up Button ---- */
.signup-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    margin-top: 6px;
}

.signup-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -80%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
}

.signup-btn:hover::before { left: 130%; }

.signup-btn:hover {
    background: linear-gradient(135deg, var(--primary-dark) 0%, #4834b8 100%);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.signup-btn:active { transform: translateY(0); }

/* ---- Divider ---- */
.divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
    color: #b0b5c5;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
}

.divider span { padding: 0 15px; }

/* ---- Login Link ---- */
.login-text {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
}

.login-text a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
    transition: var(--transition);
    position: relative;
}

.login-text a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1.5px;
    background: var(--primary);
    transition: width 0.3s ease;
}

.login-text a:hover { color: var(--primary-dark); }
.login-text a:hover::after { width: 100%; }

/* ---- Back to Home ---- */
.back-home {
    text-align: center;
    margin-top: 20px;
}

.back-home a {
    color: #a7adbd;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: var(--transition);
    padding: 6px 14px;
    border-radius: 20px;
}

.back-home a:hover {
    color: var(--primary);
    background: rgba(108, 92, 231, 0.08);
}

.back-home a i { transition: transform 0.3s ease; }
.back-home a:hover i { transform: translateX(-4px); }

/* ---- Alert Box ---- */
.alert-box {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 15px 28px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.25);
    z-index: 1000;
    transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0;
    pointer-events: none;
    min-width: 300px;
    justify-content: center;
}

.alert-box.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: all;
}

.alert-box.success {
    background: linear-gradient(135deg, #e8f9f0, #d4f5e4);
    color: #0f7a43;
    border: 1px solid #b6ecd0;
}

.alert-box.error {
    background: linear-gradient(135deg, #fdeeee, #fbdcdc);
    color: #b02a37;
    border: 1px solid #f5c2c7;
}

.alert-box.info {
    background: linear-gradient(135deg, #eef1fd, #e0e6fb);
    color: #3a56c9;
    border: 1px solid #ccd7f8;
}

.alert-box i { font-size: 18px; }

/* ---- Mobile Responsive ---- */
@media (max-width: 480px) {
    body { padding: 14px; }
    .signup-wrapper { border-radius: 18px; }
    .signup-header { padding: 24px 18px; }
    .signup-header .logo-area h2 { font-size: 23px; }
    .form-body { padding: 24px 18px; }
    .form-group input { padding: 13px 43px; font-size: 14px; }
    .form-group .input-icon { left: 15px; }
    .toggle-password { right: 10px; }
    .alert-box { min-width: 90%; font-size: 13px; padding: 14px 20px; }
    .orb-1 { width: 280px; height: 280px; }
    .orb-2 { width: 240px; height: 240px; }
}
</style>
<!-- <base target="_blank"> -->
</head>
<body>

<!-- Ambient background orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- Alert Box -->
<div id="alertBox" class="alert-box">
    <i class="fas fa-info-circle"></i>
    <span id="alertMsg">Message here</span>
</div>

<div class="signup-wrapper">

    <!-- Header -->
    <div class="signup-header">
        <div class="logo-area">
            <!-- <img src="img/logo1.webp" alt="Stackly Logo"> -->
            <h2>Stackly</h2>
        </div>
        <p>Create your account and get started.</p>
    </div>

    <!-- Form Body -->
    <div class="form-body">

        <form id="signupForm" onsubmit="handleSignup(event)">

            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrap">
                    <input type="text" id="signupName" placeholder="Enter your full name" autocomplete="name"
                           oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <input type="email" id="signupEmail" placeholder="Enter your email" autocomplete="email">
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="signupPassword" placeholder="Create your password" autocomplete="new-password">
                    <i class="fas fa-lock input-icon"></i>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('signupPassword', this)"></i>
                </div>
                <div class="hint-text">
                    <i class="fas fa-circle-info"></i>
                    <span>At least 8 characters with an uppercase letter, lowercase letter, number and special character.</span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrap">
                    <input type="password" id="signupConfirm" placeholder="Confirm your password" autocomplete="new-password">
                    <i class="fas fa-lock input-icon"></i>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('signupConfirm', this)"></i>
                </div>
            </div>

            <!-- Sign Up Button -->
            <button type="submit" class="signup-btn">
                <i class="fas fa-user-plus"></i>
                <span>Sign Up</span>
            </button>

        </form>

        <!-- Divider -->
        <div class="divider"><span>OR</span></div>

        <!-- Login -->
        <p class="login-text">
            Already have an account? <a href="login.html">Login</a>
        </p>

        <!-- Back to Home -->
        <div class="back-home">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>

    </div>

</div>

<script>
// ========== TOGGLE PASSWORD ==========
function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

// ========== ALERT BOX ==========
function showAlert(msg, type = 'info') {
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const icon = alertBox.querySelector('i');

    alertBox.className = 'alert-box ' + type;
    alertMsg.textContent = msg;

    if (type === 'success') icon.className = 'fas fa-check-circle';
    else if (type === 'error') icon.className = 'fas fa-exclamation-circle';
    else icon.className = 'fas fa-info-circle';

    alertBox.classList.add('show');

    setTimeout(() => {
        alertBox.classList.remove('show');
    }, 3000);
}

// ========== SIGN UP HANDLER ==========
function handleSignup(e) {
    e.preventDefault();

    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirm').value;

    if (!name || !email || !password || !confirm) {
        showAlert('Please fill in all fields', 'error');
        return;
    }

    const emailCheck = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailCheck.test(email)) {
        showAlert('Please enter a valid email address', 'error');
        document.getElementById('signupEmail').focus();
        return;
    }

    const passwordRegex =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

    if (!passwordRegex.test(password)) {
        showAlert(
            "Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one number and one special character.",
            "error"
        );
        document.getElementById('signupPassword').focus();
        return;
    }

    if (password !== confirm) {
        showAlert('Passwords do not match', 'error');
        document.getElementById('signupConfirm').focus();
        return;
    }

    localStorage.setItem("userName", name);
    localStorage.setItem("userEmail", email);
    showAlert('Account created successfully! Please login.', 'success');

    setTimeout(() => {
        window.location.href = 'login.html';
    }, 1500);
}
</script>

</body>
</html>
